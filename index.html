<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KCM Ranking - Table Soccer Rankings</title>
    <!-- Load runtime config before main app (optional, generated in Docker at runtime) -->
    <script src="/config.js"></script>
    <!--
      Apply a stored theme choice before first paint. Without this the page
      renders in the default theme and then snaps, which is worse than either
      theme on its own. No stored choice means the CSS media query decides.
    -->
    <script>
      try {
        var t = localStorage.getItem('kcm-theme')
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
